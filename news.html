<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Новости | TheFrodesDiD</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== СТИЛИ ДЛЯ СТРАНИЦЫ НОВОСТЕЙ ===== */
        .news-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 20px 60px;
        }
        .news-page h1 {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            color: #ff003c;
            margin-bottom: 50px;
            letter-spacing: 0.1em;
            border-bottom: 2px solid #222;
            padding-bottom: 20px;
        }
        .news-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        .news-card:hover {
            border-color: #ff003c;
            transform: translateY(-2px);
        }
        .news-card img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .news-card .date {
            color: #666;
            font-size: 0.8rem;
            font-family: 'Orbitron', monospace;
            margin-bottom: 10px;
        }
        .news-card h2 {
            font-size: 1.8rem;
            color: #ff003c;
            margin-bottom: 15px;
            font-family: 'Orbitron', monospace;
        }
        .news-card p {
            color: #ccc;
            line-height: 1.7;
        }
        .loading {
            color: #666;
            text-align: center;
            font-style: italic;
            padding: 50px 0;
        }
        .empty {
            color: #666;
            text-align: center;
            padding: 50px 0;
        }
        .back-link {
            display: inline-block;
            color: #ff003c;
            text-decoration: none;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="news-page">
        <a href="/" class="back-link">← НА ГЛАВНУЮ</a>
        <h1>📡 НОВОСТИ</h1>
        <div id="newsContainer">
            <div class="loading">Загрузка новостей...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        async function loadAllNews() {
            const container = document.getElementById('newsContainer');
            
            try {
                const { data, error } = await supabase
                    .from('news')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                
                if (data && data.length > 0) {
                    container.innerHTML = data.map(news => `
                        <div class="news-card">
                            ${news.image_url ? `<img src="${news.image_url}" alt="${news.title}">` : ''}
                            <div class="date">${formatDate(news.created_at)}</div>
                            <h2>${news.title}</h2>
                            <p>${news.content}</p>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="empty">Новостей пока нет</div>';
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="empty">Ошибка загрузки новостей</div>';
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        loadAllNews();
    </script>
</body>
</html>
