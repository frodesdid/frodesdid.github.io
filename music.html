<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TheFrodesDiD — Музыка</title>
    <meta name="description" content="TheFrodesDiD — дискография. Альбомы, синглы, безумие.">
    <meta property="og:title" content="TheFrodesDiD — Музыка">
    <meta name="theme-color" content="#0a0a0a">

    <!-- FAVICON -->
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/images/favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-gold: #ffd700;
            --color-gold-glow: rgba(255, 215, 0, 0.35);
            --color-red: #ff003c;
            --color-blue: #0066ff;
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            --nav-height: 70px;
        }

        html,
        body {
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-y: auto;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-red);
            border-radius: 2px;
        }

        #neuronCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            z-index: 1000;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.04);
            display: flex;
            align-items: center;
            padding: 0 40px;
        }

        .nav-logo {
            font-family: 'Black Ops One', sans-serif;
            font-size: 1.2rem;
            color: var(--color-gold);
            text-decoration: none;
            letter-spacing: 0.1em;
            margin-right: 40px;
            flex-shrink: 0;
        }

        .nav-logo:hover {
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .nav-links {
            display: flex;
            gap: 8px;
            list-style: none;
            flex: 1;
        }

        .nav-links li {
            position: relative;
        }

        .nav-link {
            display: block;
            padding: 10px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all var(--transition);
            border-radius: 6px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--color-gold);
            background: rgba(255, 215, 0, 0.04);
        }

        .nav-links li:has(.dropdown-menu) {
            padding-bottom: 20px;
            margin-bottom: -20px;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 4px);
            left: 50%;
            transform: translateX(-50%);
            min-width: 220px;
            background: rgba(10, 10, 10, 0.97);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.08);
            border-radius: 10px;
            padding: 8px 0;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50%) translateY(-10px);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .nav-links li:hover .dropdown-menu,
        .dropdown-menu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .dropdown-menu::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 0;
            right: 0;
            height: 12px;
            background: transparent;
        }

        .dropdown-link {
            display: block;
            padding: 14px 24px;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all var(--transition);
            border-left: 2px solid transparent;
            white-space: nowrap;
        }

        .dropdown-link:hover {
            color: var(--color-gold);
            background: rgba(255, 215, 0, 0.06);
            border-left-color: var(--color-gold);
        }

        .dropdown-link .icon {
            margin-right: 10px;
            opacity: 0.6;
            font-size: 0.8rem;
        }

        .nav-link-with-arrow {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link-with-arrow .arrow {
            font-size: 0.5rem;
            opacity: 0.4;
            transition: all var(--transition);
        }

        .nav-links li:hover .nav-link-with-arrow .arrow {
            opacity: 1;
            transform: rotate(180deg);
        }

        .music-page {
            position: relative;
            z-index: 1;
            padding-top: var(--nav-height);
            padding-bottom: 80px;
            min-height: 100vh;
        }

        .music-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .music-header {
            padding: 30px 0 20px 0;
        }

        .music-header h1 {
            font-family: 'Black Ops One', sans-serif;
            font-size: clamp(2rem, 4vw, 3.5rem);
            color: var(--color-gold);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .music-header p {
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            margin-top: 4px;
        }

        .filters-section {
            padding: 20px 0 30px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 30px;
        }

        .filter-btn {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all var(--transition);
        }

        .filter-btn:hover {
            color: var(--text-secondary);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .filter-btn.active {
            color: var(--color-gold);
            border-color: var(--color-gold);
            background: rgba(255, 215, 0, 0.04);
        }

        .releases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
            padding: 10px 0;
        }

        .release-item {
            background: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all var(--transition);
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
        }

        .release-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .release-item:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 215, 0, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .release-cover {
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            position: relative;
            background: var(--bg-primary);
        }

        .release-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .release-item:hover .release-cover img {
            transform: scale(1.04);
        }

        /* ===== ПЛАШКА ХИТА ===== */
        .popular-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--color-gold);
            color: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            z-index: 2;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .popular-badge::before {
            content: '★ ';
        }

        .audio-preview {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            opacity: 0;
            transform: scale(0.8);
            z-index: 3;
        }

        .release-item:hover .audio-preview {
            opacity: 1;
            transform: scale(1);
        }

        .audio-preview:hover {
            background: var(--color-red);
            border-color: var(--color-red);
        }

        .audio-preview .play-icon {
            color: #fff;
            font-size: 0.7rem;
        }

        .release-info {
            padding: 14px 16px;
        }

        .release-info .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            color: var(--text-primary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .release-info .meta {
            display: flex;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.5rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            flex-wrap: wrap;
        }

        .release-info .meta .tag {
            padding: 3px 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            font-size: 0.45rem;
        }

        .release-info .meta .tag-type {
            color: var(--text-secondary);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .release-info .meta .tag-popular {
            color: var(--color-gold);
            border-color: rgba(255, 215, 0, 0.2);
            background: rgba(255, 215, 0, 0.04);
            font-weight: 700;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            display: none;
        }

        .no-results .icon {
            font-size: 2rem;
            margin-bottom: 10px;
            opacity: 0.3;
        }

        footer {
            position: relative;
            z-index: 1;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }

        .footer-copy {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.5rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
        }

        .footer-socials {
            display: flex;
            gap: 16px;
        }

        .footer-socials a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.5rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .footer-socials a:hover {
            color: var(--color-gold);
        }

        @media (max-width: 768px) {
            header {
                padding: 0 16px;
            }
            .nav-logo {
                font-size: 0.9rem;
                margin-right: 16px;
            }
            .nav-link {
                font-size: 0.5rem;
                padding: 8px 12px;
            }
            .nav-links {
                gap: 4px;
            }
            .dropdown-menu {
                min-width: 180px;
            }
            .dropdown-link {
                font-size: 0.55rem;
                padding: 12px 18px;
            }
            .music-container {
                padding: 0 16px;
            }
            .releases-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 16px;
            }
            .release-info .title {
                font-size: 0.5rem;
            }
            .release-info .meta {
                font-size: 0.4rem;
            }
            .release-info .meta .tag {
                font-size: 0.35rem;
                padding: 2px 8px;
            }
            .filters-section {
                gap: 6px;
                padding: 12px 0 20px 0;
            }
            .filter-btn {
                font-size: 0.4rem;
                padding: 6px 14px;
            }
            .music-header h1 {
                font-size: 1.8rem;
            }
            footer {
                padding: 12px 16px;
                flex-direction: column;
                gap: 8px;
            }
            .footer-copy {
                font-size: 0.4rem;
            }
            .footer-socials a {
                font-size: 0.4rem;
            }
            .popular-badge {
                font-size: 0.5rem;
                padding: 4px 12px;
                top: 8px;
                right: 8px;
                border-radius: 10px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 0 10px;
            }
            .nav-logo {
                font-size: 0.7rem;
                margin-right: 10px;
            }
            .nav-link {
                font-size: 0.4rem;
                padding: 6px 8px;
                letter-spacing: 0.05em;
            }
            .nav-links {
                gap: 0px;
            }
            .dropdown-menu {
                min-width: 150px;
            }
            .dropdown-link {
                font-size: 0.45rem;
                padding: 10px 14px;
            }
            .releases-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 12px;
            }
            .release-info {
                padding: 10px 12px;
            }
            .release-info .title {
                font-size: 0.45rem;
            }
            .release-info .meta {
                font-size: 0.35rem;
                gap: 4px;
            }
            .release-info .meta .tag {
                font-size: 0.3rem;
                padding: 2px 6px;
            }
            .audio-preview {
                width: 28px;
                height: 28px;
                bottom: 8px;
                right: 8px;
            }
            .audio-preview .play-icon {
                font-size: 0.5rem;
            }
            .filter-btn {
                font-size: 0.35rem;
                padding: 4px 10px;
            }
            .music-header h1 {
                font-size: 1.4rem;
            }
            .music-header p {
                font-size: 0.5rem;
            }
            .popular-badge {
                font-size: 0.4rem;
                padding: 3px 8px;
                top: 6px;
                right: 6px;
                border-radius: 8px;
            }
        }
    </style>
</head>

            // ==========================================
            // 2. РЕНДЕР С СОРТИРОВКОЙ
            // ==========================================
            const grid = document.getElementById('releasesGrid');
            const noResults = document.getElementById('noResults');
            let currentFilter = 'all';

            function getSortedReleases(filter) {
                let filtered = releases;

                if (filter === 'album') {
                    filtered = filtered.filter(r => r.type === 'album');
                } else if (filter === 'single') {
                    filtered = filtered.filter(r => r.type === 'single');
                }

                // Глобальная сортировка от новых к старым (по году)
                return filtered.sort((a, b) => parseInt(b.year) - parseInt(a.year));
            }

            function renderReleases() {
                const sorted = getSortedReleases(currentFilter);

                grid.innerHTML = '';

                if (sorted.length === 0) {
                    noResults.style.display = 'block';
                    return;
                }
                noResults.style.display = 'none';

                sorted.forEach((release, index) => {
                    const item = document.createElement('div');
                    item.className = 'release-item';
                    item.style.transitionDelay = (index * 0.03) + 's';

                    const typeLabels = {
                        album: 'Альбом',
                        single: 'Сингл'
                    };

                    item.innerHTML = `
                        <div class="release-cover">
                            <img src="${release.cover}" alt="${release.title}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%23111111%22 width=%22200%22 height=%22200%22/><text x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-size=%2216%22 font-family=%22monospace%22>${release.title.substring(0,2)}</text></svg>'">
                            ${release.popular ? '<span class="popular-badge">ХИТ</span>' : ''}
                            <div class="audio-preview" onclick="event.stopPropagation(); window.open('${release.link}', '_blank')">
                                <span class="play-icon">▶</span>
                            </div>
                        </div>
                        <div class="release-info">
                            <div class="title">${release.title}</div>
                            <div class="meta">
                                <span class="tag">${release.year}</span>
                                <span class="tag tag-type">${typeLabels[release.type] || release.type}</span>
                                ${release.popular ? '<span class="tag tag-popular">★ Хит</span>' : ''}
                            </div>
                        </div>
                    `;

                    grid.appendChild(item);

                    setTimeout(() => {
                        item.classList.add('visible');
                    }, 50 + index * 25);
                });
            }

            // ==========================================
            // 3. ФИЛЬТРЫ
            // ==========================================
            const filterBtns = document.querySelectorAll('.filter-btn');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderReleases();
                });
            });

            // ==========================================
            // 4. НЕЙРОННЫЙ ФОН
            // ==========================================
            (function initPlexus() {
                const canvas = document.getElementById('neuronCanvas');
                const ctx = canvas.getContext('2d');
                let width, height;
                const nodes = [];
                let animationId = null;

                function resize() {
                    width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width;
                    canvas.height = height;
                }
                resize();
                window.addEventListener('resize', resize);

                const colors = [
                    { h: 340, s: 90, l: 50 },
                    { h: 350, s: 100, l: 45 },
                    { h: 330, s: 80, l: 55 },
                    { h: 0, s: 90, l: 40 },
                    { h: 340, s: 70, l: 60 },
                    { h: 355, s: 95, l: 35 }
                ];

                class PlexusNode {
                    constructor() {
                        this.x = Math.random() * width;
                        this.y = Math.random() * height;
                        this.radius = 1.5 + Math.random() * 3;
                        this.baseRadius = this.radius;
                        this.vx = (Math.random() - 0.5) * 0.3;
                        this.vy = (Math.random() - 0.5) * 0.3;
                        this.pulse = Math.random() * Math.PI * 2;
                        this.speed = 0.005 + Math.random() * 0.015;
                        const c = colors[Math.floor(Math.random() * colors.length)];
                        this.hue = c.h;
                        this.sat = c.s;
                        this.light = c.l;
                        this.targetLight = this.light;
                        this.phase = Math.random() * 10;
                    }

                    update() {
                        this.pulse += this.speed;
                        this.phase += 0.02;
                        this.x += this.vx + Math.sin(this.phase) * 0.1;
                        this.y += this.vy + Math.cos(this.phase * 0.7) * 0.1;
                        if (this.x < 0 || this.x > width) this.vx *= -1;
                        if (this.y < 0 || this.y > height) this.vy *= -1;
                        const pulseFactor = Math.sin(this.pulse) * 0.5 + 0.5;
                        this.radius = this.baseRadius * (0.6 + pulseFactor * 0.8);
                        this.light = this.targetLight + Math.sin(this.pulse * 1.5) * 15;
                    }

                    draw() {
                        const glowRadius = this.radius * 4;
                        const gradient = ctx.createRadialGradient(
                            this.x, this.y, 0,
                            this.x, this.y, glowRadius
                        );
                        gradient.addColorStop(0, 'hsla(' + this.hue + ', ' + this.sat + '%, ' + this.light + '%, 0.12)');
                        gradient.addColorStop(1, 'hsla(' + this.hue + ', ' + this.sat + '%, ' + this.light + '%, 0)');
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowColor = 'hsla(' + this.hue + ', 100%, 60%, 0.4)';
                        ctx.shadowBlur = 12;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                        ctx.fillStyle = 'hsla(' + this.hue + ', ' + this.sat + '%, ' + this.light + '%, 0.85)';
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius * 0.3, 0, Math.PI * 2);
                        ctx.fillStyle = 'hsla(' + this.hue + ', 100%, 90%, 0.25)';
                        ctx.fill();
                    }
                }

                const nodeCount = Math.min(80, Math.floor((width * height) / 15000));
                for (let i = 0; i < nodeCount; i++) {
                    nodes.push(new PlexusNode());
                }

                function animate() {
                    ctx.clearRect(0, 0, width, height);

                    for (let i = 0; i < nodes.length; i++) {
                        nodes[i].update();
                        nodes[i].draw();
                    }

                    for (let i = 0; i < nodes.length; i++) {
                        for (let j = i + 1; j < nodes.length; j++) {
                            const a = nodes[i];
                            const b = nodes[j];
                            const dx = a.x - b.x;
                            const dy = a.y - b.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            if (dist < 250) {
                                const opacity = 0.12 * (1 - dist / 250);
                                const hue = 340;

                                ctx.beginPath();
                                ctx.moveTo(a.x, a.y);
                                ctx.lineTo(b.x, b.y);
                                ctx.strokeStyle = 'hsla(' + hue + ', 80%, 60%, ' + opacity + ')';
                                ctx.lineWidth = 0.5 + opacity * 1.5;
                                ctx.stroke();

                                if (dist < 120 && opacity > 0.04) {
                                    ctx.beginPath();
                                    ctx.moveTo(a.x, a.y);
                                    ctx.lineTo(b.x, b.y);
                                    ctx.strokeStyle = 'hsla(' + hue + ', 100%, 80%, ' + opacity * 0.25 + ')';
                                    ctx.lineWidth = 2 + opacity * 2.5;
                                    ctx.shadowColor = 'hsla(' + hue + ', 100%, 60%, ' + opacity * 0.15 + ')';
                                    ctx.shadowBlur = 8;
                                    ctx.stroke();
                                    ctx.shadowBlur = 0;
                                }
                            }
                        }
                    }

                    animationId = requestAnimationFrame(animate);
                }

                animate();

                window.addEventListener('beforeunload', function() {
                    if (animationId) cancelAnimationFrame(animationId);
                });
            })();

            // ==========================================
            // 5. ИНИЦИАЛИЗАЦИЯ
            // ==========================================
            renderReleases();

            console.log('🔥 TheFrodesDiD — Дискография');
            console.log('📀 Релизов загружено:', releases.length);
            console.log('⭐ Популярных треков:', releases.filter(r => r.popular).length);

        });
