<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка | TheFrodesDiD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .admin-container {
            max-width: 600px;
            width: 100%;
            background: #111;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #222;
        }
        .admin-container h1 {
            font-family: 'Orbitron', monospace;
            color: #ff003c;
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 0.1em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff003c;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #ff003c;
            border: none;
            border-radius: 8px;
            color: #0a0a0a;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            background: #00ff88;
            transform: scale(1.02);
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .status.success {
            display: block;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        .status.error {
            display: block;
            background: rgba(255, 0, 60, 0.1);
            border: 1px solid #ff003c;
            color: #ff003c;
        }
        .login-form .form-group input[type="password"] {
            font-size: 1.2rem;
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>
    <div class="admin-container" id="app">
        <!-- Вход -->
        <div id="loginForm">
            <h1>🔒 ВХОД</h1>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="adminPassword" placeholder="Введи пароль">
            </div>
            <button class="submit-btn" id="loginBtn">ВОЙТИ</button>
            <div id="loginStatus" class="status error"></div>
        </div>

        <!-- Публикация -->
        <div id="publishForm" style="display:none;">
            <h1>📰 НОВАЯ НОВОСТЬ</h1>
            <div class="form-group">
                <label>Заголовок</label>
                <input type="text" id="newsTitle" placeholder="Например: Новый альбом выходит 15 июня">
            </div>
            <div class="form-group">
                <label>Текст новости</label>
                <textarea id="newsContent" placeholder="Полный текст новости..."></textarea>
            </div>
            <div class="form-group">
                <label>Ссылка на картинку (опционально)</label>
                <input type="text" id="newsImage" placeholder="https://i.imgur.com/xxxxx.jpg">
            </div>
            <div class="form-group">
                <label>Slug (для ссылки, латиница, через дефис)</label>
                <input type="text" id="newsSlug" placeholder="novyy-albom-15-iyunya">
            </div>
            <button class="submit-btn" id="publishBtn">ОПУБЛИКОВАТЬ</button>
            <div id="publishStatus" class="status"></div>
        </div>
    </div>

    <!-- ===== ПОДКЛЮЧЕНИЯ ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        (function() {
            'use strict';

            // ===== КЛЮЧИ =====
            const SUPABASE_URL = 'https://fggfkxnjahgrkrewhjzhk.supabase.co';
            const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnZ2ZreG5qYWhncmtyZXdqaHprIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MzExNDkyMSwiZXhwIjoyMDk4NjkwOTIxfQ.14bNs2s3a5PhU_j5Mfsh598_vYzEtuMqm0cZKdMoS9I';

            // ===== ХЕШ ПАРОЛЯ (SHA-256) =====
            // Сгенерируй свой хеш здесь: https://emn178.github.io/online-tools/sha256.html
            const ADMIN_PASSWORD_HASH = 'aea49665cb8c0bb7be47740c579a4f63bad95a553e7940d1db3efb0d05c3de38'; // ← ЗАМЕНИ НА СВОЙ

            // ===== ПОДКЛЮЧАЕМ SUPABASE =====
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);

            // ===== DOM-ЭЛЕМЕНТЫ =====
            const loginForm = document.getElementById('loginForm');
            const publishForm = document.getElementById('publishForm');
            const loginStatus = document.getElementById('loginStatus');
            const publishStatus = document.getElementById('publishStatus');
            const passwordInput = document.getElementById('adminPassword');
            const loginBtn = document.getElementById('loginBtn');
            const publishBtn = document.getElementById('publishBtn');

            const titleInput = document.getElementById('newsTitle');
            const contentInput = document.getElementById('newsContent');
            const imageInput = document.getElementById('newsImage');
            const slugInput = document.getElementById('newsSlug');

            // ===== ФУНКЦИЯ ВХОДА =====
            function login() {
                const password = passwordInput.value;

                if (!password) {
                    loginStatus.textContent = '❌ Введи пароль';
                    loginStatus.className = 'status error';
                    loginStatus.style.display = 'block';
                    return;
                }

                const hashedInput = CryptoJS.SHA256(password).toString();

                if (hashedInput === ADMIN_PASSWORD_HASH) {
                    loginForm.style.display = 'none';
                    publishForm.style.display = 'block';
                    loginStatus.className = 'status';
                    loginStatus.style.display = 'none';
                } else {
                    loginStatus.textContent = '❌ Неверный пароль';
                    loginStatus.className = 'status error';
                    loginStatus.style.display = 'block';
                }
            }

            // ===== ПУБЛИКАЦИЯ НОВОСТИ =====
            async function publishNews() {
                const title = titleInput.value.trim();
                const content = contentInput.value.trim();
                const imageUrl = imageInput.value.trim();
                const slug = slugInput.value.trim();

                if (!title || !content || !slug) {
                    publishStatus.textContent = '❌ Заполни все обязательные поля';
                    publishStatus.className = 'status error';
                    publishStatus.style.display = 'block';
                    return;
                }

                try {
                    const { error } = await supabaseClient
                        .from('news')
                        .insert([{ title, content, image_url: imageUrl || null, slug }]);

                    if (error) throw error;

                    publishStatus.textContent = '✅ Новость опубликована!';
                    publishStatus.className = 'status success';
                    publishStatus.style.display = 'block';

                    titleInput.value = '';
                    contentInput.value = '';
                    imageInput.value = '';
                    slugInput.value = '';

                } catch (err) {
                    console.error('Ошибка публикации:', err);
                    publishStatus.textContent = '❌ Ошибка: ' + err.message;
                    publishStatus.className = 'status error';
                    publishStatus.style.display = 'block';
                }
            }

            // ===== НАВЕШИВАЕМ СОБЫТИЯ =====
            loginBtn.addEventListener('click', login);
            publishBtn.addEventListener('click', publishNews);

            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') login();
            });

            console.log('✅ Админка загружена');
        })();
    </script>
</body>
</html>
