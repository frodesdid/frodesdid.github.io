<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка | TheFrodesDiD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .admin-container {
            max-width: 600px;
            width: 100%;
            background: #111;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #222;
        }
        .admin-container h1 {
            font-family: 'Orbitron', monospace;
            color: #ff003c;
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 0.1em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff003c;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #ff003c;
            border: none;
            border-radius: 8px;
            color: #0a0a0a;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            background: #00ff88;
            transform: scale(1.02);
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .status.success {
            display: block;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        .status.error {
            display: block;
            background: rgba(255, 0, 60, 0.1);
            border: 1px solid #ff003c;
            color: #ff003c;
        }
        .login-form .form-group input[type="password"] {
            font-size: 1.2rem;
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>
    <div class="admin-container" id="app">
        <!-- Вход -->
        <div id="loginForm">
            <h1>🔒 ВХОД</h1>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="adminPassword" placeholder="Введи пароль">
            </div>
            <button class="submit-btn" onclick="login()">ВОЙТИ</button>
            <div id="loginStatus" class="status error"></div>
        </div>

        <!-- Публикация -->
        <div id="publishForm" style="display:none;">
            <h1>📰 НОВАЯ НОВОСТЬ</h1>
            <div class="form-group">
                <label>Заголовок</label>
                <input type="text" id="newsTitle" placeholder="Например: Новый альбом выходит 15 июня">
            </div>
            <div class="form-group">
                <label>Текст новости</label>
                <textarea id="newsContent" placeholder="Полный текст новости..."></textarea>
            </div>
            <div class="form-group">
                <label>Ссылка на картинку (опционально)</label>
                <input type="text" id="newsImage" placeholder="https://i.imgur.com/xxxxx.jpg">
            </div>
            <div class="form-group">
                <label>Slug (для ссылки, латиница, через дефис)</label>
                <input type="text" id="newsSlug" placeholder="novyy-albom-15-iyunya">
            </div>
            <button class="submit-btn" onclick="publishNews()">ОПУБЛИКОВАТЬ</button>
            <div id="publishStatus" class="status"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ===== КЛЮЧИ =====
        const SUPABASE_URL = 'https://fggfkxnjahgrkrewhjzhk.supabase.co';
        const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnZ2ZreG5qYWhncmtyZXdqaHprIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MzExNDkyMSwiZXhwIjoyMDk4NjkwOTIxfQ.14bNs2s3a5PhU_j5Mfsh598_vYzEtuMqm0cZKdMoS9I';
        const ADMIN_PASSWORD = 'ваш_пароль'; // 👈 ЗАМЕНИ НА СВОЙ

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);

        // ===== ВХОД =====
        function login() {
            const password = document.getElementById('adminPassword').value;
            const status = document.getElementById('loginStatus');
            
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('publishForm').style.display = 'block';
                status.className = 'status';
                status.style.display = 'none';
            } else {
                status.textContent = '❌ Неверный пароль';
                status.className = 'status error';
                status.style.display = 'block';
            }
        }

        // ===== ПУБЛИКАЦИЯ =====
        async function publishNews() {
            const title = document.getElementById('newsTitle').value.trim();
            const content = document.getElementById('newsContent').value.trim();
            const imageUrl = document.getElementById('newsImage').value.trim();
            const slug = document.getElementById('newsSlug').value.trim();
            
            const status = document.getElementById('publishStatus');
            
            if (!title || !content || !slug) {
                status.textContent = '❌ Заполни все обязательные поля';
                status.className = 'status error';
                status.style.display = 'block';
                return;
            }
            
            try {
                const { error } = await supabase
                    .from('news')
                    .insert([{ title, content, image_url: imageUrl || null, slug }]);
                
                if (error) throw error;
                
                status.textContent = '✅ Новость опубликована!';
                status.className = 'status success';
                status.style.display = 'block';
                
                document.getElementById('newsTitle').value = '';
                document.getElementById('newsContent').value = '';
                document.getElementById('newsImage').value = '';
                document.getElementById('newsSlug').value = '';
                
            } catch (err) {
                status.textContent = '❌ Ошибка: ' + err.message;
                status.className = 'status error';
                status.style.display = 'block';
            }
        }

        document.getElementById('adminPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
