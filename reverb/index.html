<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheFrodesDiD - КОРОЛЕВСКИЙ КАЛЬКУЛЯТОР РЕВЕРБЕРАЦИИ</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" sizes="64x64">
    
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="channels-header">
            <div class="title-container">
                <h1 class="main-title" id="mainTitle">THEFRODESDID</h1>
            </div>
            <p class="tagline">РАССЧИТАЙ СВОЮ ИДЕАЛЬНУЮ РЕВЕРБЕРАЦИЮ</p>
        </header>

        <!-- Основной калькулятор -->
        <main class="calculator">
            <!-- Ввод BPM -->
            <div class="input-section">
                <label for="bpm" class="label">BPM</label>
                <input type="number" id="bpm" class="bpm-input" value="128" min="60" max="240">
            </div>

            <!-- Выбор комнаты -->
            <div class="room-section">
                <div class="room-options">
                    <button class="room-btn active" data-size="small">
                        <span class="room-name">Studio</span>
                        <span class="room-desc">Small</span>
                    </button>
                    
                    <button class="room-btn" data-size="medium">
                        <span class="room-name">Club</span>
                        <span class="room-desc">Medium</span>
                    </button>
                    
                    <button class="room-btn" data-size="large">
                        <span class="room-name">Hall</span>
                        <span class="room-desc">Large</span>
                    </button>
                </div>
            </div>

            <!-- Кнопка расчета -->
            <button id="calculateBtn" class="calculate-btn">
                Calculate
            </button>

            <!-- Результаты -->
            <div class="results" id="results">
                <div class="result-item">
                    <div class="result-label">Pre-delay</div>
                    <div class="result-value" id="preDelay">0 ms</div>
                </div>
                
                <div class="result-item">
                    <div class="result-label">Decay time</div>
                    <div class="result-value" id="decayTime">0 ms</div>
                </div>
                
                <div class="result-item">
                    <div class="result-label">Total reverb</div>
                    <div class="result-value" id="totalReverb">0 ms</div>
                </div>
            </div>
        </main>

        <!-- Футер -->
        <footer class="footer">
            <div class="bpm-display">
                Current BPM: <span id="bpmDisplay">128</span>
            </div>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
