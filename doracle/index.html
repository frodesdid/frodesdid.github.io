<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МАГИЧЕСКИЙ ШАТЁР - TheFrodesDiD</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    
    
</head>
<body>
    
    <div class="container">
        <header class="hero">
            <div class="title-container">
                <h1 class="main-title" id="mainTitle">THEFRODESDID</h1>
            </div>
            </header>

    <!-- НАЧАЛО ОРАКУЛА - вставляется после header -->
    <section class="oracle-section">
        <div class="cyber-oracle">
            <div class="terminal-header">
                <span class="blink">⚡</span> КВАНТОВЫЙ ОРАКУЛ ПРАВДЫ <span class="blink">⚡</span>
            </div>
            
            <div class="query-interface">
                <input type="text" id="oracleQuestion" 
                       class="cyber-input" 
                       placeholder="> ЗАПРОСИТЬ ПРОРОЧЕСТВО..."
                       maxlength="100">
                <button class="hack-button" onclick="consultOracle()">
                    <span class="btn-text">АНАЛИЗИРОВАТЬ_БУДУЩЕЕ</span>
                    <div class="scanning-animation"></div>
                </button>
            </div>

            <div class="oracle-response" id="oracleOutput">
                <div class="response-placeholder">
                    ОРАКУЛ ОЖИДАЕТ ВАШЕГО ВОПРОСА...
                </div>
            </div>

            <div class="oracle-stats">
                <div class="stat">ТОЧНОСТЬ: <span id="accuracy">97.3%</span></div>
                <div class="stat">ЭНТРОПИЯ: <span id="entropy">ВЫСОКАЯ</span></div>
            </div>
        </div>
    </section>
    <!-- КОНЕЦ ОРАКУЛА -->

    <!-- Параллакс элементы -->
    <div class="visual-elements">
    </div>

    <!-- Параллакс элементы -->
    <div class="visual-elements">
        <div class="chain chain-1" data-depth="0.3">⛓️⛓️⛓️⛓️⛓️</div>
        <div class="chain chain-2" data-depth="0.5">⛓️⛓️⛓️⛓️⛓️</div>
        <div class="crack crack-1" data-depth="0.2">⌇⌇⌇⌇⌇</div>
    </div>



<script src="script.js"></script>

</body>
</html>
