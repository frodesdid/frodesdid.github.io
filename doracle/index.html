<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEFRODESDID</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    
    
</head>
<body>
    
    <div class="container">
        <header class="hero">
            <div class="title-container">
                <h1 class="main-title" id="mainTitle">THEFRODESDID</h1>
            </div>
            <p class="tagline">I'm not the hero they want. I'm the consequence they deserve.</p>
        </header>
    </div>

    <!-- Параллакс элементы -->
    <div class="visual-elements">
        <div class="chain chain-1" data-depth="0.3">⛓️⛓️⛓️⛓️⛓️</div>
        <div class="chain chain-2" data-depth="0.5">⛓️⛓️⛓️⛓️⛓️</div>
        <div class="crack crack-1" data-depth="0.2">⌇⌇⌇⌇⌇</div>
    </div>

    <!-- Добавьте этот блок в ваш сайт -->
<div class="cyber-oracle">
    <div class="oracle-terminal">
        <div class="terminal-header">
            <span class="blink">⚡</span> NEURO_ORACLE v3.0
            <div class="access-protocol">ACCESS: REBEL_SHAMAN</div>
        </div>
        
        <div class="query-section">
            <input type="text" id="oracleQuestion" 
                   class="cyber-input" 
                   placeholder="> ЗАПРОСИТЬ ПРЕДСКАЗАНИЕ..."
                   maxlength="60">
            <button class="hack-button" onclick="initiateOracle()">
                <span class="btn-text">АНАЛИЗИРОВАТЬ_БУДУЩЕЕ</span>
                <div class="scanning-animation"></div>
            </button>
        </div>

        <div class="oracle-output" id="oracleOutput">
            <div class="default-message">
                СИСТЕМА ГОТОВА К ПРИЁМУ ЗАПРОСОВ<br>
                <span class="sub-message">Задайте вопрос о будущем</span>
            </div>
        </div>

        <div class="oracle-stats">
            <div class="stat">
                <span class="stat-label">ТОЧНОСТЬ:</span>
                <span class="stat-value">87.3%</span>
            </div>
            <div class="stat">
                <span class="stat-label">КВАНТОВЫЙ_ШУМ:</span>
                <span class="stat-value" id="quantumNoise">12.7%</span>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
