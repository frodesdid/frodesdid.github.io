<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЦИФРОВАЯ ЛАВА-ЛАМПА // THEFRODESDID</title>
    <link rel="stylesheet" href="lava-styles.css">
    <style>
        /* Экстренные стили для немедленного отображения */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #00ff88;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }
    </style>
</head>
<body>
    <!-- Экстренный контейнер -->
    <div id="emergencyContainer" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    ">
        <h1 style="color: #ff003c; margin-bottom: 20px;">ЦИФРОВАЯ ЛАВА-ЛАМПА</h1>
        <div id="statusMessage" style="margin-bottom: 20px;">Инициализация...</div>
        <canvas id="emergencyCanvas" width="400" height="600" style="
            border: 2px solid #0066ff;
            border-radius: 10px;
            background: #111;
        "></canvas>
        <div style="margin-top: 20px;">
            <button id="startBtn" style="
                background: #ff003c;
                color: white;
                border: none;
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                margin: 5px;
            ">СТАРТ</button>
            <button id="stopBtn" style="
                background: #0066ff;
                color: white;
                border: none;
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                margin: 5px;
            ">СТОП</button>
        </div>
    </div>

    <!-- Основные скрипты -->
    <script src="lava-engine.js"></script>
    <script src="lava-renderer.js"></script>
    
    <!-- Экстренный скрипт -->
    <script>
        console.log('🔥 Экстренная инициализация лава-лампы');
        
        let animationId = null;
        const canvas = document.getElementById('emergencyCanvas');
        const ctx = canvas.getContext('2d');
        const statusMessage = document.getElementById('statusMessage');
        
        // Простейшая физика капель
        class Blob {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height;
                this.radius = 15 + Math.random() * 25;
                this.color = Math.random() > 0.5 ? '#ff003c' : '#ff5500';
                this.speedY = -1 - Math.random() * 2;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.wobble = 0;
                this.wobbleSpeed = 0.05 + Math.random() * 0.1;
            }
            
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.wobble) * 0.3;
                this.wobble += this.wobbleSpeed;
                
                // Отталкивание от стенок
                if (this.x < this.radius || this.x > canvas.width - this.radius) {
                    this.speedX *= -0.8;
                }
                
                // Достиг верха - падаем вниз
                if (this.y < this.radius) {
                    this.speedY = Math.abs(this.speedY) * 0.5;
                }
                
                // Падение вниз
                if (this.y > canvas.height - this.radius) {
                    this.speedY = -Math.abs(this.speedY);
                    this.radius = 15 + Math.random() * 25;
                }
                
                // Гравитация
                this.speedY += 0.05;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius/3, 
                    this.y - this.radius/3, 
                    0,
                    this.x, 
                    this.y, 
                    this.radius
                );
                
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, this.color + '66');
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Свечение
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        
        let blobs = [];
        const BLOB_COUNT = 8;
        
        // Создаем начальные капли
        for (let i = 0; i < BLOB_COUNT; i++) {
            setTimeout(() => {
                blobs.push(new Blob());
            }, i * 300);
        }
        
        function animate() {
            // Очищаем с эффектом затухания
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем колбу
            ctx.strokeStyle = '#0066ff';
            ctx.lineWidth = 3;
            ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);
            
            // Обновляем и рисуем капли
            blobs.forEach(blob => {
                blob.update();
                blob.draw();
                
                // Простые столкновения
                blobs.forEach(other => {
                    if (blob !== other) {
                        const dx = other.x - blob.x;
                        const dy = other.y - blob.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const minDistance = blob.radius + other.radius;
                        
                        if (distance < minDistance) {
                            // Отталкивание
                            const angle = Math.atan2(dy, dx);
                            const targetX = blob.x + Math.cos(angle) * minDistance;
                            const targetY = blob.y + Math.sin(angle) * minDistance;
                            
                            const ax = (targetX - other.x) * 0.05;
                            const ay = (targetY - other.y) * 0.05;
                            
                            blob.x -= ax;
                            blob.y -= ay;
                            other.x += ax;
                            other.y += ay;
                        }
                    }
                });
            });
            
            animationId = requestAnimationFrame(animate);
        }
        
        // Управление
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!animationId) {
                statusMessage.textContent = 'ЛАМПА АКТИВИРОВАНА';
                statusMessage.style.color = '#00ff88';
                animate();
            }
        });
        
        document.getElementById('stopBtn').addEventListener('click', () => {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
                statusMessage.textContent = 'ЛАМПА ОСТАНОВЛЕНА';
                statusMessage.style.color = '#ff003c';
            }
        });
        
        // Автозапуск через 2 секунды
        setTimeout(() => {
            if (!animationId) {
                statusMessage.textContent = 'АВТОМАТИЧЕСКИЙ СТАРТ...';
                animate();
            }
        }, 2000);
        
        console.log('✅ Экстренная лава-лампа готова');
    </script>

    <script>
    // Инициализация полной системы
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Запуск цифровой лава-лампы');
    
        // Создаем движок
        const engine = new LavaLampEngine({
            blobCount: 15,
            temperature: 0.6,
            viscosity: 0.3,
            chaos: 0.2
        });
    
        // Создаем рендерер
        const renderer = new LavaLampRenderer(engine, 'lavaCanvas');
    
        // Создаем панель управления
        createControlPanel(engine, renderer);
    
        // Глобальный доступ для отладки
        window.lavaLamp = { engine, renderer };
    
        console.log('🎉 Цифровая лава-лампа запущена!');
    
        // Автозапуск через 1 секунду
        setTimeout(() => {
            engine.isRunning = true;
            renderer.start();
        }, 1000);
    });

    function createControlPanel(engine, renderer) {
        const panel = document.createElement('div');
        panel.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(10, 10, 10, 0.8);
            border: 2px solid #0066ff;
            border-radius: 10px;
            padding: 15px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            z-index: 10000;
            min-width: 250px;
            backdrop-filter: blur(10px);
        `;
    
        panel.innerHTML = `
            <h3 style="margin-top: 0; color: #ff003c;">ЛАВА-ЛАМПА 3000</h3>
        
            <div style="margin: 10px 0;">
                <label>ТЕМПЕРАТУРА: <span id="tempValue">0.6</span></label>
                <input type="range" id="tempSlider" min="0" max="1" step="0.01" value="0.6" 
                       style="width: 100%; margin: 5px 0;">
            </div>
        
            <div style="margin: 10px 0;">
                <label>ВЯЗКОСТЬ: <span id="viscValue">0.3</span></label>
                <input type="range" id="viscSlider" min="0" max="1" step="0.01" value="0.3" 
                       style="width: 100%; margin: 5px 0;">
            </div>
        
            <div style="margin: 10px 0;">
                <label>ХАОС: <span id="chaosValue">0.2</span></label>
                <input type="range" id="chaosSlider" min="0" max="1" step="0.01" value="0.2" 
                       style="width: 100%; margin: 5px 0;">
            </div>
        
            <div style="margin: 15px 0;">
                <button id="addBlobBtn" style="
                    background: #ff003c;
                    color: white;
                    border: none;
                    padding: 8px;
                    margin: 3px;
                    cursor: pointer;
                    width: 48%;
                ">+ КАПЛЯ</button>
            
                <button id="resetBtn" style="
                    background: #0066ff;
                    color: white;
                    border: none;
                    padding: 8px;
                    margin: 3px;
                    cursor: pointer;
                    width: 48%;
                ">СБРОС</button>
            </div>
        
            <div style="margin: 15px 0;">
                <button id="screenshotBtn" style="
                    background: #00ff88;
                    color: #0a0a0a;
                    border: none;
                    padding: 8px;
                    margin: 3px;
                    cursor: pointer;
                    width: 100%;
                ">📸 СНИМОК</button>
            </div>
        
            <div style="font-size: 12px; opacity: 0.7; margin-top: 10px;">
                <div>КАПЕЛЬ: <span id="blobCount">15</span></div>
                <div>СТАТУС: <span id="status">АКТИВНА</span></div>
            </div>
        `;
    
        document.body.appendChild(panel);
    
        // Обработчики
        document.getElementById('tempSlider').addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            engine.setTemperature(value);
            document.getElementById('tempValue').textContent = value.toFixed(2);
        });
    
        document.getElementById('viscSlider').addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            engine.setViscosity(value);
            document.getElementById('viscValue').textContent = value.toFixed(2);
        });
    
        document.getElementById('chaosSlider').addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            engine.setChaos(value);
            document.getElementById('chaosValue').textContent = value.toFixed(2);
        });
    
        document.getElementById('addBlobBtn').addEventListener('click', () => {
            engine.addBlob();
            updateStats();
        });
    
        document.getElementById('resetBtn').addEventListener('click', () => {
            engine.reset();
            updateStats();
        });
        
        document.getElementById('screenshotBtn').addEventListener('click', () => {
            renderer.takeScreenshot();
        });
        
        // Обновление статистики
        function updateStats() {
            const state = engine.getState();
            document.getElementById('blobCount').textContent = state.blobCount;
            document.getElementById('status').textContent = 
                state.isRunning ? 'АКТИВНА' : 'ПАУЗА';
        }
    
        // Периодическое обновление
        setInterval(updateStats, 1000);
    }
    </script>
    
</body>
</html>
