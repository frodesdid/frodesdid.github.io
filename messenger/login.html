<div class="login-container">
    <div class="tabs">
        <button class="tab active" onclick="showTab('login')">Вход</button>
        <button class="tab" onclick="showTab('register')">Регистрация</button>
        <button class="tab" onclick="showTab('invite')">У меня есть инвайт</button>
    </div>
    
    <!-- Форма входа -->
    <div id="login-form" class="form-container">
        <h2>Вход в аккаунт</h2>
        <form onsubmit="return loginUser(event)">
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Пароль" required>
            <button type="submit" class="btn-primary">Войти</button>
        </form>
    </div>
    
    <!-- Форма регистрации (только для приглашенных) -->
    <div id="register-form" class="form-container" style="display: none;">
        <h2>Регистрация</h2>
        <p class="info">Для регистрации нужен инвайт-код от друга</p>
        <form onsubmit="return registerUser(event)">
            <input type="email" id="reg-email" placeholder="Email" required>
            <input type="password" id="reg-password" placeholder="Пароль (минимум 6 символов)" minlength="6" required>
            <input type="text" id="reg-displayname" placeholder="Как вас называть?" required>
            <input type="text" id="reg-invite" placeholder="Инвайт-код" required>
            <button type="submit" class="btn-primary">Создать аккаунт</button>
        </form>
    </div>
    
    <!-- Проверка инвайта -->
    <div id="invite-form" class="form-container" style="display: none;">
        <h2>Проверка инвайта</h2>
        <p>Введите инвайт-код, чтобы начать регистрацию</p>
        <form onsubmit="return checkInvite(event)">
            <input type="text" id="invite-code" placeholder="Инвайт-код (например: ABC123-XYZ456)" required>
            <button type="submit" class="btn-primary">Проверить</button>
        </form>
    </div>
    
    <div id="message" class="message"></div>
</div>
