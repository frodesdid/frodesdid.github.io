<!DOCTYPE html>
<html>
<head>
    <title>Frodes Messenger</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>🔒 Frodes Messenger</h1>
        
        <div id="login-form" class="form">
            <h2>Вход</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Пароль">
            <button onclick="login()">Войти</button>
            <p><a href="#" onclick="showRegister()">Нет аккаунта? Создать</a></p>
        </div>
        
        <div id="register-form" class="form" style="display:none">
            <h2>Регистрация</h2>
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-password" placeholder="Пароль (6+ символов)">
            <input type="text" id="reg-name" placeholder="Ваше имя">
            <input type="text" id="reg-invite" placeholder="Инвайт-код">
            <button onclick="register()">Создать аккаунт</button>
            <p><a href="#" onclick="showLogin()">Уже есть аккаунт? Войти</a></p>
        </div>
        
        <div id="message" class="message"></div>
    </div>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
