<!DOCTYPE html>
<html>
<head>
    <title>Frodes Messenger</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Стили для мессенджера */
        body { display: flex; height: 100vh; background: #f5f5f5; }
        .sidebar { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .user-info { padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .friends-list { flex: 1; overflow-y: auto; padding: 10px; }
        .friend { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; }
        .friend:hover { background: #f8f9ff; }
        .friend.active { background: #eef2ff; font-weight: bold; }
        .friend-avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; background: #667eea; color: white; display: flex; align-items: center; justify-content: center; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .chat-header { background: white; padding: 20px; border-bottom: 1px solid #ddd; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; background: #f8f9fa; }
        .message { margin-bottom: 15px; max-width: 70%; }
        .message.received { align-self: flex-start; }
        .message.sent { align-self: flex-end; margin-left: auto; }
        .message-bubble { padding: 12px 16px; border-radius: 18px; }
        .received .message-bubble { background: white; border: 1px solid #e0e0e0; }
        .sent .message-bubble { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .message-input { display: flex; padding: 20px; background: white; border-top: 1px solid #ddd; }
        .message-input input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 24px; margin-right: 10px; }
        .message-input button { padding: 12px 25px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 24px; }
        .empty-chat { text-align: center; color: #999; margin-top: 100px; }
    </style>
</head>
<body>
    <!-- Левая панель -->
    <div class="sidebar">
        <div class="user-info">
            <h3 id="current-user">Загрузка...</h3>
            <p id="user-email"></p>
            <button onclick="logout()" style="margin-top: 10px; background: rgba(255,255,255,0.2);">Выйти</button>
            <button onclick="createInvite()" style="margin-top: 10px; background: rgba(255,255,255,0.2);">Пригласить друга</button>
        </div>
        
        <div class="friends-list" id="friends-list">
            <!-- Друзья загружаются сюда -->
        </div>
    </div>
    
    <!-- Основная область -->
    <div class="main">
        <div class="chat-header" id="chat-header">
            <h3>Выберите чат</h3>
        </div>
        
        <div class="messages" id="messages-container">
            <div class="empty-chat">
                <h3>💬 Начните общение</h3>
                <p>Выберите друга из списка слева</p>
            </div>
        </div>
        
        <div class="message-input">
            <input type="text" id="message-input" placeholder="Введите сообщение..." disabled>
            <button onclick="sendMessage()" id="send-btn" disabled>Отправить</button>
        </div>
    </div>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <script src="js/config.js"></script>
    <script>
        // Глобальные переменные
        let currentUser = null;
        let currentChatId = null;
        let unsubscribe = null;
        
        // При загрузке
        document.addEventListener('DOMContentLoaded', async () => {
            // Проверка авторизации
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    initApp(user);
                } else {
                    window.location.href = 'index.html';
                }
            });
        });
        
        // Инициализация приложения
        async function initApp(user) {
            console.log("Инициализация для:", user.email);
            
            // Обновляем информацию о пользователе
            document.getElementById('current-user').textContent = user.displayName || user.email;
            document.getElementById('user-email').textContent = user.email;
            
            // Загружаем друзей
            await loadFriends();
            
            // Загружаем чаты
            await loadChats();
        }
        
        // Загрузка друзей
        async function loadFriends() {
            try {
                const userDoc = await db.collection('users').doc(currentUser.uid).get();
                const userData = userDoc.data();
                const friendIds = userData?.friends || [];
                
                const friendsList = document.getElementById('friends-list');
                friendsList.innerHTML = '';
                
                if (friendIds.length === 0) {
                    friendsList.innerHTML = '<p style="padding:20px;color:#666;">Пока нет друзей</p>';
                    return;
                }
                
                // Загружаем информацию о каждом друге
                for (const friendId of friendIds) {
                    const friendDoc = await db.collection('users').doc(friendId).get();
                    if (friendDoc.exists) {
                        const friend = friendDoc.data();
                        const div = document.createElement('div');
                        div.className = 'friend';
                        div.innerHTML = `
                            <div class="friend-avatar">${friend.displayName?.charAt(0) || '?'}</div>
                            <div>
                                <strong>${friend.displayName || 'Пользователь'}</strong>
                                <div style="font-size:12px;color:#666;">${friend.status || 'не в сети'}</div>
                            </div>
                        `;
                        
                        // При клике открываем чат
                        div.onclick = () => openChatWithFriend(friendId);
                        friendsList.appendChild(div);
                    }
                }
                
            } catch (error) {
                console.error("Ошибка загрузки друзей:", error);
            }
        }
        
        // Открыть чат с другом
        async function openChatWithFriend(friendId) {
            try {
                console.log("Открываем чат с другом:", friendId);
        
                // Проверяем авторизацию
                if (!auth.currentUser) {
                    alert("Вы не авторизованы!");
                    return;
                }
        
                const yourUid = auth.currentUser.uid;
                const chatId = [yourUid, friendId].sort().join('_');
        
                console.log("ID чата:", chatId);
        
                // Создаем ID чата
                currentChatId = [currentUser.uid, friendId].sort().join('_');
                
                // Проверяем, есть ли чат
                const chatDoc = await db.collection('chats').doc(currentChatId).get();
                
                if (!chatDoc.exists) {
                    // Создаем новый чат
                    await db.collection('chats').doc(currentChatId).set({
                        participants: [currentUser.uid, friendId],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastMessage: null
                    });
                    
                    // Добавляем приветственное сообщение
                    await db.collection('chats').doc(currentChatId).collection('messages').add({
                        senderId: 'system',
                        content: 'Чат создан',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        type: 'system'
                    });
                }
                
                // Загружаем информацию о друге для заголовка
                const friendDoc = await db.collection('users').doc(friendId).get();
                if (friendDoc.exists) {
                    const friend = friendDoc.data();
                    document.getElementById('chat-header').innerHTML = `
                        <h3>💬 ${friend.displayName || 'Друг'}</h3>
                        <p style="color:#666;">${friend.status || 'не в сети'}</p>
                    `;
                }
                
                // Активируем поле ввода
                document.getElementById('message-input').disabled = false;
                document.getElementById('send-btn').disabled = false;
                
                // Загружаем сообщения
                await loadMessages();
                
                // Подписываемся на новые сообщения
                if (unsubscribe) unsubscribe();
                unsubscribe = db.collection('chats').doc(currentChatId)
                    .collection('messages')
                    .orderBy('timestamp', 'asc')
                    .onSnapshot((snapshot) => {
                        loadMessages();
                    });
                    
            } catch (error) {
                console.error("Ошибка открытия чата:", error);
                alert("Ошибка: " + error.message);
            }
        }
        
        // Загрузка сообщений
        async function loadMessages() {
            if (!currentChatId) return;
            
            try {
                const messagesQuery = await db.collection('chats').doc(currentChatId)
                    .collection('messages')
                    .orderBy('timestamp', 'asc')
                    .get();
                
                const container = document.getElementById('messages-container');
                container.innerHTML = '';
                
                if (messagesQuery.empty) {
                    container.innerHTML = '<div class="empty-chat"><p>Пока нет сообщений</p></div>';
                    return;
                }
                
                messagesQuery.forEach(doc => {
                    const msg = doc.data();
                    const isSent = msg.senderId === currentUser.uid;
                    const isSystem = msg.senderId === 'system';
                    
                    const div = document.createElement('div');
                    div.className = `message ${isSystem ? 'system' : (isSent ? 'sent' : 'received')}`;
                    
                    if (isSystem) {
                        div.innerHTML = `<p style="text-align:center;color:#666;font-size:14px;">${msg.content}</p>`;
                    } else {
                        div.innerHTML = `
                            <div class="message-bubble">
                                ${msg.content}
                                <div style="font-size:11px;margin-top:5px;opacity:0.7;">
                                    ${msg.timestamp?.toDate().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}
                                </div>
                            </div>
                        `;
                    }
                    
                    container.appendChild(div);
                });
                
                // Прокрутка вниз
                container.scrollTop = container.scrollHeight;
                
            } catch (error) {
                console.error("Ошибка загрузки сообщений:", error);
            }
        }
        
        // Отправка сообщения
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (!text || !currentChatId) {
                alert("Введите сообщение!");
                return;
            }
            
            try {
                await db.collection('chats').doc(currentChatId)
                    .collection('messages')
                    .add({
                        senderId: currentUser.uid,
                        content: text,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        type: 'text'
                    });
                
                // Обновляем последнее сообщение в чате
                await db.collection('chats').doc(currentChatId).update({
                    lastMessage: {
                        content: text,
                        senderId: currentUser.uid,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    }
                });
                
                input.value = '';
                input.focus();
                
            } catch (error) {
                console.error("Ошибка отправки:", error);
                alert("Ошибка отправки: " + error.message);
            }
        }
        
        // Создание инвайта
        async function createInvite() {
            try {
                const code = Math.random().toString(36).substring(2, 8).toUpperCase() + 
                            '-' + Math.random().toString(36).substring(2, 8).toUpperCase();
                
                await db.collection('invites').add({
                    code: code,
                    createdBy: currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    used: false,
                    expiresAt: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000),
                    maxUses: 1
                });
                
                alert(`✅ Инвайт создан!\n\nКод: ${code}\n\nСкопируйте и отправьте другу.`);
                
            } catch (error) {
                console.error("Ошибка создания инвайта:", error);
                alert("Ошибка: " + error.message);
            }
        }
        
        // Выход
        async function logout() {
            if (confirm("Выйти из аккаунта?")) {
                try {
                    if (unsubscribe) unsubscribe();
                    await auth.signOut();
                    window.location.href = 'index.html';
                } catch (error) {
                    console.error("Ошибка выхода:", error);
                }
            }
        }
        
        // Загрузка чатов (для боковой панели)
        async function loadChats() {
            // Простая реализация - можно расширить
        }
        
        // Экспорт функций
        window.sendMessage = sendMessage;
        window.logout = logout;
        window.createInvite = createInvite;
    </script>
</body>
</html>
