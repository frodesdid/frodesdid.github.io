<div class="app-container">
    <!-- Боковая панель -->
    <div class="sidebar">
        <!-- Профиль пользователя -->
        <div class="user-profile">
            <div class="avatar-container">
                <img id="user-avatar" src="assets/default-avatar.png" alt="Аватар">
                <span class="online-status" id="user-status"></span>
            </div>
            <div class="user-info">
                <h3 id="user-name">Загрузка...</h3>
                <p id="user-email">...</p>
            </div>
            <button class="btn-icon" onclick="openSettings()" title="Настройки">⚙️</button>
        </div>
        
        <!-- Поиск и фильтры -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Поиск друзей или чатов...">
            <button class="btn-icon" onclick="clearSearch()">✕</button>
        </div>
        
        <!-- Список чатов -->
        <div class="chats-section">
            <div class="section-header">
                <h4>Чаты</h4>
                <button class="btn-small" onclick="startNewChat()">+ Новый</button>
            </div>
            <div class="chats-list" id="chats-list">
                <!-- Чаты будут загружены динамически -->
                <div class="loading">Загрузка чатов...</div>
            </div>
        </div>
        
        <!-- Список друзей -->
        <div class="friends-section">
            <div class="section-header">
                <h4>Друзья</h4>
                <button class="btn-small" onclick="showInviteDialog()">👥 Пригласить</button>
            </div>
            <div class="friends-list" id="friends-list">
                <!-- Друзья будут загружены динамически -->
            </div>
        </div>
        
        <!-- Кнопка выхода -->
        <div class="sidebar-footer">
            <button class="btn-logout" onclick="logout()">
                🚪 Выйти
            </button>
        </div>
    </div>
    
    <!-- Основная область чата -->
    <div class="main-content">
        <!-- Заглушка при выборе чата -->
        <div class="chat-placeholder" id="chat-placeholder">
            <div class="placeholder-content">
                <div class="placeholder-icon">💬</div>
                <h2>Выберите чат</h2>
                <p>Начните общение с другом или создайте новый чат</p>
                <button class="btn-primary" onclick="startNewChat()">Начать новый чат</button>
            </div>
        </div>
        
        <!-- Активный чат (скрыт по умолчанию) -->
        <div class="chat-container" id="chat-container" style="display: none;">
            <!-- Заголовок чата -->
            <div class="chat-header">
                <div class="chat-partner">
                    <img id="chat-avatar" src="assets/default-avatar.png" alt="Аватар">
                    <div>
                        <h3 id="chat-partner-name">...</h3>
                        <p id="chat-partner-status" class="status">...</p>
                    </div>
                </div>
                <div class="chat-actions">
                    <button class="btn-icon" onclick="showChatInfo()" title="Информация о чате">ℹ️</button>
                    <button class="btn-icon" onclick="toggleChatMenu()" title="Меню">⋮</button>
                </div>
            </div>
            
            <!-- Сообщения -->
            <div class="messages-container" id="messages-container">
                <!-- Сообщения загружаются динамически -->
            </div>
            
            <!-- Ввод сообщения -->
            <div class="message-input-container">
                <div class="input-tools">
                    <button class="btn-icon" onclick="attachFile()" title="Прикрепить файл">📎</button>
                    <button class="btn-icon" onclick="showEmojiPicker()" title="Эмодзи">😊</button>
                    <input type="file" id="file-input" hidden multiple>
                </div>
                <div class="input-wrapper">
                    <textarea 
                        id="message-input" 
                        placeholder="Введите сообщение..." 
                        rows="1"
                        oninput="autoResize(this)"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <button class="btn-send" onclick="sendMessage()" id="send-button">
                        <span class="send-text">Отправить</span>
                        <span class="send-icon">➤</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Правая панель (настройки/профиль) -->
    <div class="right-sidebar" id="right-sidebar">
        <!-- Контент загружается динамически -->
    </div>
</div>

<!-- Модальные окна -->
<div class="modal" id="invite-modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('invite-modal')">&times;</span>
        <h2>Пригласить друга</h2>
        <div id="invite-content">
            <!-- Контент будет загружен из friends.js -->
        </div>
    </div>
</div>

<div class="modal" id="settings-modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('settings-modal')">&times;</span>
        <h2>Настройки</h2>
        <div id="settings-content">
            <!-- Контент будет загружен из profile.js -->
        </div>
    </div>
</div>

<!-- Уведомления -->
<div id="notification-container" class="notifications"></div>

<!-- Подключаем скрипты -->
<script src="js/app.js"></script>
<script src="js/messenger.js"></script>
<script src="js/friends.js"></script>
<script src="js/profile.js"></script>
